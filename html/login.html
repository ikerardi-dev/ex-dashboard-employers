<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – HR Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css" />
</head>

<body>
  <div class="hr-wrap">
    <div class="hr-logo">
      <div class="hr-logo-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="4" y="6" width="20" height="16" rx="2" stroke="#fff" stroke-width="1.8" />
          <path d="M9 12h10M9 16h6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </div>
      <span class="hr-logo-text">HR Management</span>
    </div>

    <div class="hr-card">
      <h2>Bienvenido de nuevo</h2>
      <p>Ingresa tus credenciales para acceder al panel.</p>

      <div class="hr-error" id="error-msg"></div>

      <form action="/login" method="post" id="loginForm">
        <div class="hr-field">
          <label for="email">Email</label>
          <div class="hr-input-wrap">
            <i class="ti ti-mail" aria-hidden="true"></i>
            <input type="email" id="email" name="email" placeholder="admin@empresa.com" autocomplete="email" required />
          </div>
        </div>

        <div class="hr-field">
          <label for="password">Contraseña</label>
          <div class="hr-input-wrap">
            <i class="ti ti-lock" aria-hidden="true"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"
              required />
            <button class="toggle-pw" id="togglePw" type="button" aria-label="Mostrar contraseña">
              <i class="ti ti-eye" id="eyeIcon" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="hr-submit">Iniciar Sesión</button>
      </form>

      <a class="hr-forgot" href="https://www.youtube.com/watch?v=eUBdxcU4y9U">¿Olvidaste tu contraseña?</a>
    </div>

    <p class="hr-footer">
      © 2024 HR Management System. Todos los derechos reservados.
    </p>
  </div>

  <script src="/js/login.js"></script>
</body>

</html>
